<script>
const $=(s,r=document)=>r.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const fmt=(v,d=3)=>v==null||isNaN(v)?'—':Math.abs(v)>=1000?v.toFixed(0):(+v).toPrecision(d);
const DEMO='<span class="tag">Demo Data</span>',SIM='<span class="tag">Simulated Result</span>';
const PD='#e8590c',HC='#0d9488',ACC='#0b6cc9';
Chart.defaults.color=getComputedStyle(document.body).getPropertyValue('--mut').trim()||'#586d7e';Chart.defaults.borderColor='rgba(128,128,128,.2)';Chart.defaults.font.family='system-ui,sans-serif';
const CH={};function chart(id,cfg){const c=document.getElementById(id);if(!c)return;CH[id]&&CH[id].destroy();cfg.options=Object.assign({responsive:true,maintainAspectRatio:false},cfg.options);CH[id]=new Chart(c,cfg)}
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296},gauss=r=>Math.sqrt(-2*Math.log(r()+1e-12))*Math.cos(2*Math.PI*r());

/* ---------- DATA LAYER ---------- */
const SPEC={Jitter:[.0062,.0049,.0039,.0028,.7],Shimmer:[.0297,.0189,.0176,.01,.7],Pitch:[145,42,181,52,0],HNR:[21,4.4,24.7,3.4,-.7],NHR:[.029,.04,.011,.009,.7],RPDE:[.52,.1,.44,.09,.25],DFA:[.73,.06,.69,.07,.25],PPE:[.25,.09,.13,.05,.7],Spread1:[-5.33,1.1,-6.76,.9,.6],Spread2:[.25,.08,.16,.07,.4],D2:[2.45,.35,2.14,.3,.3]};
function mkDS(name,cols,rows,demo,target,posVal=null,ignored=[]){
  const tv=[...new Set(rows.map(r=>r[target]).filter(v=>v!=null))].sort((a,b)=>a-b);
  const pos = posVal !== null ? posVal : tv[tv.length-1];
  return{name,demo,cols,rows,target,pos,feats:cols.filter(c=>c!==target),n:rows.length,ignored};
}
function demoDS(){const r=rng(42),rows=[];for(let i=0;i<195;i++){const pd=i<147?1:0,z=gauss(r),row={};for(const f in SPEC){const[a,b,c,d,l]=SPEC[f];let v=(pd?a:c)+(pd?b:d)*(l*z+Math.sqrt(1-l*l)*gauss(r));if(['Jitter','Shimmer','NHR','PPE'].includes(f))v=Math.max(v,(pd?a:c)*.15+1e-4);row[f]=v}row.status=pd;rows.push(row)}return mkDS('Synthetic demo dataset (195 samples, UCI-like structure)',[...Object.keys(SPEC),'status'],rows,true,'status',1)}
let DS=demoDS();
const MODELS=[['Logistic Regression',40,4,4,11,.91,12],['Support Vector Machine',42,2,3,12,.95,35],['Random Forest',43,1,4,11,.96,410],['K-Nearest Neighbors',41,3,4,11,.92,8],['Decision Tree',39,5,4,11,.84,15],['Gradient Boosting',42,2,2,13,.97,620]].map(([name,tp,fn,fp,tn,auc,ms])=>{const n=tp+fn+fp+tn,p=tp/(tp+fp),r=tp/(tp+fn);return{name,tp,fn,fp,tn,ms,Accuracy:(tp+tn)/n,Precision:p,Recall:r,Specificity:tn/(tn+fp),F1:2*p*r/(p+r),'ROC-AUC':auc}});
const METRICS=['Accuracy','Precision','Recall','F1','ROC-AUC'],bestBy=m=>MODELS.reduce((b,x)=>x[m]>b[m]?x:b);
const BASE={PPE:.17,Spread1:.16,Jitter:.11,Shimmer:.1,HNR:.09,NHR:.08,RPDE:.08,Pitch:.07,Spread2:.06,DFA:.04,D2:.04};
function imp(mi){const r=rng(100+mi),o=Object.entries(BASE).map(([k,v])=>[k,v*(.8+.4*r())]),s=sum(o.map(x=>x[1]));return o.map(([k,v])=>[k,v/s]).sort((a,b)=>b[1]-a[1])}
const INFO=[[/jitter/i,'Variation in fundamental frequency between consecutive vocal cycles.'],[/shimmer/i,'Variation in amplitude between consecutive vocal cycles.'],[/pitch|fo\(|^fo$|f0/i,'Fundamental frequency (F0) of the voice, i.e. vocal-fold vibration rate.'],[/nhr/i,'Amount of noise relative to harmonic components (higher = noisier signal).'],[/hnr/i,'Ratio of harmonic to noise energy in the signal (higher = more periodic).'],[/rpde/i,'Recurrence period density entropy: nonlinear measure of how irregular the vibration periods are.'],[/dfa/i,'Detrended fluctuation analysis: scaling exponent describing stochastic self-similarity of the signal.'],[/ppe/i,'Pitch period entropy: entropy of pitch-period variation, a measure of impaired F0 control.'],[/spread1/i,'Nonlinear measure of fundamental-frequency variation.'],[/spread2/i,'Second nonlinear measure of fundamental-frequency variation.'],[/d2/i,'Correlation dimension: nonlinear measure of dynamical complexity of the signal.']];
const info=n=>(INFO.find(([r])=>r.test(n))||[0,'Numeric column from the loaded dataset.'])[1];
const vals=(f,g)=>DS.rows.filter(r=>r[f]!=null&&r[DS.target]!=null&&((r[DS.target]===DS.pos)===g)).map(r=>r[f]);
const cohen=f=>{const a=vals(f,true),b=vals(f,false);if(!a.length||!b.length)return 0;const s1=sd(a),s2=sd(b),pool=Math.sqrt((s1**2+s2**2)/2);return pool===0?0:(mean(a)-mean(b))/pool};
const nPos=()=>DS.rows.filter(r=>r[DS.target]===DS.pos).length;
function pairs(a,b){const x=[],y=[];DS.rows.forEach(r=>{if(r[a]!=null&&r[b]!=null){x.push(r[a]);y.push(r[b])}});return[x,y]}
function corr(a,b){const[x,y]=pairs(a,b);if(x.length<2)return 0;const mx=mean(x),my=mean(y);let n=0,dx=0,dy=0;x.forEach((v,i)=>{n+=(v-mx)*(y[i]-my);dx+=(v-mx)**2;dy+=(y[i]-my)**2});const den=Math.sqrt(dx*dy);return den===0?0:n/den}
const opts=(a,v)=>a.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('');
const kpi=(l,v,t='')=>`<div class="card kpi"><span>${l}</span><b>${v}</b>${t}</div>`;

/* ---------- AUDIO Engine ---------- */
const AUD={};let MR;
function fft(re,im){const n=re.length;for(let i=1,j=0;i<n;i++){let b=n>>1;for(;j&b;b>>=1)j^=b;j^=b;if(i<j){[re[i],re[j]]=[re[j],re[i]];[im[i],im[j]]=[im[j],im[i]]}}
for(let len=2;len<=n;len<<=1){const a=-2*Math.PI/len;for(let i=0;i<n;i+=len)for(let k=0;k<len/2;k++){const w=Math.cos(a*k),s=Math.sin(a*k),u=i+k,v=u+len/2,xr=re[v]*w-im[v]*s,xi=re[v]*s+im[v]*w;re[v]=re[u]-xr;im[v]=im[u]-xi;re[u]+=xr;im[u]+=xi}}}
function analyze(buf){
 let x=buf.getChannelData(0);x=x.subarray(0,Math.min(x.length,Math.floor(buf.sampleRate*12)));
 const D=Math.max(1,Math.round(buf.sampleRate/11025)),sr=buf.sampleRate/D,n=Math.floor(x.length/D),y=new Float32Array(n);
 for(let i=0;i<n;i++){let s=0;for(let j=0;j<D;j++)s+=x[i*D+j];y[i]=s/D}
 let pk=0;for(const v of y)pk=Math.max(pk,Math.abs(v));if(pk<1e-4)throw new Error('The recording is silent or empty.');
 const N=512,H=128,lo=Math.floor(sr/400),hi=Math.ceil(sr/60),t=[],f0=[],amp=[],rs=[];
 for(let s=0;s+N<=n;s+=H){let e=0;for(let i=0;i<N;i++)e+=y[s+i]**2;const rms=Math.sqrt(e/N);let best=-1,bl=0;
  if(rms>pk*.05)for(let l=lo;l<=hi;l++){let c=0;for(let i=0;i+l<N;i++)c+=y[s+i]*y[s+i+l];c/=e*(N-l)/N;if(c>best){best=c;bl=l}}
  t.push((s+N/2)/sr);amp.push(rms);if(best>.5){f0.push(sr/bl);rs.push(Math.min(best,.99))}else{f0.push(null);rs.push(null)}}
 const v=f0.map((p,i)=>p?i:-1).filter(i=>i>=0);if(v.length<5)throw new Error('Too few voiced frames detected. Please sustain a clear “Ah”.');
 let jd=0,sd2=0,c=0;for(let k=1;k<v.length;k++)if(v[k]===v[k-1]+1){const a=v[k-1],b=v[k];jd+=Math.abs(1/f0[a]-1/f0[b]);sd2+=Math.abs(amp[a]-amp[b]);c++}
 const hnr=mean(v.map(i=>10*Math.log10(rs[i]/(1-rs[i])))),F={Jitter:c?jd/c/mean(v.map(i=>1/f0[i])):NaN,Shimmer:c?sd2/c/mean(v.map(i=>amp[i])):NaN,Pitch:mean(v.map(i=>f0[i])),HNR:hnr,NHR:1/10**(hnr/10)};
 const M=512,SH=256,hann=Array.from({length:M},(_,i)=>.5-.5*Math.cos(2*Math.PI*i/(M-1))),cols=[],pw=new Float64Array(M/2);
 for(let s=0;s+M<=n;s+=SH){const re=new Float64Array(M),im=new Float64Array(M);for(let i=0;i<M;i++)re[i]=y[s+i]*hann[i];fft(re,im);const col=new Float32Array(M/2);for(let k=0;k<M/2;k++){const p=re[k]**2+im[k]**2;col[k]=10*Math.log10(p+1e-12);pw[k]+=p}cols.push(col)}
 const nb=Math.max(1,cols.length),spec=Array.from(pw,(p,k)=>({x:+(k*sr/M).toFixed(1),y:+(10*Math.log10(p/nb+1e-12)).toFixed(2)}));
 return{t,f0,F,cols,spec,sr,dur:n/sr}}
function jet(u){u=Math.max(0,Math.min(1,u));return[Math.round(255*Math.min(1,Math.max(0,u*2-.2))),Math.round(255*Math.min(1,Math.max(0,u*1.6-.1))),Math.round(255*Math.min(1,.45+u*1.1-Math.max(0,u-.5)*1.6))]}
function drawSpec(R){const cv=$('#sg');if(!cv)return;const W=R.cols.length,Hh=256;cv.width=W;cv.height=Hh;const g=cv.getContext('2d'),im=g.createImageData(W,Hh);let mx=-1e9;R.cols.forEach(c=>c.forEach(v=>mx=Math.max(mx,v)));
 R.cols.forEach((c,x)=>{for(let k=0;k<Hh;k++){const[r,gg,b]=jet((c[k]-(mx-80))/80),o=((Hh-1-k)*W+x)*4;im.data[o]=r;im.data[o+1]=gg;im.data[o+2]=b;im.data[o+3]=255}});g.putImageData(im,0,0);
 cv.onmousemove=e=>{const b=cv.getBoundingClientRect(),tt=(e.clientX-b.left)/b.width*R.dur,ff=(1-(e.clientY-b.top)/b.height)*R.sr/2;$('#sgi').textContent=`t = ${tt.toFixed(2)} s · f = ${ff.toFixed(0)} Hz`}}
function wavePts(buf){const x=buf.getChannelData(0),B=900,st=Math.ceil(x.length/B),o=[];for(let i=0;i<B;i++){let m=0;for(let j=i*st;j<Math.min(x.length,(i+1)*st);j++)if(Math.abs(x[j])>Math.abs(m))m=x[j];o.push({x:+(i*st/buf.sampleRate).toFixed(3),y:m})}return o}
const lineCfg=(data,col,xl,yl,extra={})=>({type:'line',data:{datasets:[Object.assign({data,borderColor:col,borderWidth:1.3,pointRadius:0,pointHitRadius:6,tension:0,spanGaps:false},extra)]},options:{animation:false,parsing:false,plugins:{legend:{display:false}},scales:{x:{type:'linear',title:{display:true,text:xl}},y:{title:{display:true,text:yl}}}}});
function vmsg(t,e){const m=$('#vmsg');if(m){m.className='msg'+(e?' e':'');m.textContent=t;m.hidden=!t}}
async function loadBlob(b,name){vmsg('');if(!b||!b.size)return vmsg('Empty recording or file. Please try again.',1);
 let buf;try{const ac=new(window.AudioContext||window.webkitAudioContext)();buf=await ac.decodeAudioData(await b.arrayBuffer());ac.close()}catch(e){return vmsg('Unsupported or corrupted audio file. Please upload a valid .wav recording.',1)}
 if(!buf.length||buf.duration<1)return vmsg('The recording is too short (under 1 s).',1);

async function rec(){const btn=$('#rec');if(MR&&MR.state==='recording'){MR.stop();return}
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true}),ch=[];MR=new MediaRecorder(st);MR.ondataavailable=e=>ch.push(e.data);MR.onstop=()=>{st.getTracks().forEach(t=>t.stop());loadBlob(new Blob(ch,{type:MR.mimeType}),'microphone recording')};MR.start();btn.textContent='■ Stop recording';btn.classList.add('g')}

function run(){if(!AUD.buf)return;$('#vprog').hidden=false;$('#an').disabled=true;setTimeout(()=>{try{AUD.R=analyze(AUD.buf);voice()}catch(e){$('#vprog').hidden=true;$('#an').disabled=false;vmsg(e.message,1)}},40)}
function rangeBar(f,v){const a=vals(f,true),b=vals(f,false);if(!a.length)return'';const all=[...a,...b],lo=Math.min(...all),hi=Math.max(...all),p=x=>Math.max(0,Math.min(100,(x-lo)/(hi-lo||1)*100));return`<div class="bar" title="Position relative to dataset range"><u style="left:${p(mean(b))}%;background:${HC}"></u><u style="left:${p(mean(a))}%;background:${PD}"></u><u class="v" style="left:${p(v)}%"></u></div><div class="m">▮ teal = healthy mean · ▮ orange = Parkinson’s mean · ● this sample</div>`}
function classify(F){const ks=Object.keys(F).filter(k=>DS.feats.includes(k));if(ks.length<3)return null;const rowz=ks.map(k=>{const a=vals(k,true),b=vals(k,false),s=Math.sqrt((sd(a)**2+sd(b)**2)/2)||1,zp=(F[k]-mean(a))/s,zh=(F[k]-mean(b))/s;return{k,zp,zh,c:zh*zh-zp*zp}});
 const dp=Math.sqrt(mean(rowz.map(r=>r.zp**2))),dh=Math.sqrt(mean(rowz.map(r=>r.zh**2))),p=1/(1+Math.exp(3*(dp-dh)));return{p,top:rowz.sort((a,b)=>Math.abs(b.c)-Math.abs(a.c)).slice(0,3).map(r=>r.k)}}
function voice(){
 const has=!!AUD.buf,R=AUD.R;
 $('#page').innerHTML=`<div class="hero"><h2>Voice Analysis</h2><p>Upload or record a sustained vowel and inspect the acoustic signal.</p></div>
 <div class="disc">Sustain the vowel “Ah” for approximately 5–10 seconds, in a quiet room, at a steady comfortable pitch.</div>
 <div class="card"><div class="row"><label class="btn" style="cursor:pointer">⬆ Upload .wav<input id="fi" type="file" accept="audio/*,.wav" hidden></label><button class="btn g" id="rec">● Record with microphone</button><button class="btn" id="an" ${has?'':'disabled'}>Analyze recording</button></div>
 <div id="vmsg" class="msg" hidden></div><div id="vprog" class="prog" hidden><i></i></div>
 ${has?`<div class="row"><audio controls src="${AUD.url}" style="max-width:100%"></audio><span class="pill ok">Duration ${AUD.buf.duration.toFixed(2)} s</span><span class="m">${esc(AUD.name)} · ${AUD.buf.sampleRate} Hz</span></div>`:'<div class="m">No recording loaded yet — upload a file or record to begin.</div>'}</div>
 ${has?`<div class="grid"><div class="card"><h3>Waveform</h3><div class="cv"><canvas id="c1"></canvas></div></div>${R?`<div class="card"><h3>Pitch contour</h3><div class="cv"><canvas id="c2"></canvas></div></div><div class="card"><h3>Frequency spectrum</h3><div class="cv"><canvas id="c3"></canvas></div></div><div class="card"><h3>Spectrogram</h3><canvas class="sg" id="sg"></canvas><div class="m" id="sgi">Hover for time / frequency · 0 – ${(R.sr/2/1000).toFixed(1)} kHz</div></div>`:''}</div>`:''}
 ${R?featRes(R):''}`;
 $('#fi').onchange=e=>e.target.files[0]&&loadBlob(e.target.files[0],e.target.files[0].name);$('#rec').onclick=rec;$('#an').onclick=run;
 if(has)chart('c1',lineCfg(wavePts(AUD.buf),ACC,'Time (s)','Amplitude'));

wrap('dataset',()=>{const cells=DS.n*DS.cols.length,miss=sum(DS.cols.map(c=>DS.rows.filter(r=>r[c]==null).length)),dup=DS.n-new Set(DS.rows.map(r=>DS.cols.map(c=>r[c]).join('|'))).size,np=nPos(),
 Q=[['Completeness',1-miss/cells,'Share of non-missing cells'],['Duplicates',1-dup/DS.n,'Share of unique rows'],['Class balance',Math.min(1,2*Math.min(np,DS.n-np)/DS.n),'2 × minority-class share (1 = balanced)'],['Feature coverage',DS.feats.filter(f=>DS.rows.filter(r=>r[f]!=null).length>=.95*DS.n&&sd(DS.rows.map(r=>r[f]).filter(v=>v!=null))>0).length/DS.feats.length,'Features with ≥95% values and non-zero variance']],sc=Math.round(mean(Q.map(q=>q[1]))*100);
 $('#page .hero').insertAdjacentHTML('afterend',`<div class="grid"><div class="card"><h3>Data quality score <span class="m">· mean of four transparent heuristics</span></h3><div class="dq"><div class="dqs" style="background:conic-gradient(var(--acc) ${sc*3.6}deg,var(--line) 0)"><div style="background:var(--card);border-radius:50%;width:92px;height:92px;display:grid;place-items:center"><div><b>${sc}</b>/ 100</div></div></div><div>${Q.map(q=>`<div class="mrow tp" data-tip="${q[2]}" style="grid-template-columns:110px 1fr 44px"><span>${q[0]}</span><div class="lbar"><i style="width:${q[1]*100}%"></i></div><b>${Math.round(q[1]*100)}%</b></div>`).join('')}</div></div></div>${ai('AI Dataset Insight',`${DS.n} observations × ${DS.feats.length} features; ${miss} missing values and ${dup} duplicate rows. Class split is ${np} vs ${DS.n-np} (minority share ${(Math.min(np,DS.n-np)/DS.n*100).toFixed(0)}%), so accuracy alone can be misleading — report recall and ROC-AUC with grouped cross-validation.`)}</div>`);
 const cc=$$('#page h3').find(h=>/^Correlation matrix/.test(h.textContent));if(cc){const cf=DS.feats.slice(0,20),pr=[];for(let i=0;i<cf.length;i++)for(let j=i+1;j<cf.length;j++)pr.push([cf[i],cf[j],corr(cf[i],cf[j])]);pr.sort((a,b)=>Math.abs(b[2])-Math.abs(a[2]));
  cc.parentElement.insertAdjacentHTML('afterend',`<div class="card"><h3>Top feature relationships</h3><div class="row m"><span>−1</span><div class="grad" style="flex:1;min-width:120px"></div><span>+1</span></div><div>${pr.slice(0,6).map(p=>`<div class="mrow" style="grid-template-columns:minmax(120px,1.4fr) 1fr 48px"><span>${esc(p[0])} × ${esc(p[1])}</span><div class="lbar"><i style="width:${Math.abs(p[2])*100}%"></i></div><b>${p[2].toFixed(2)}</b></div>`).join('')}</div><p class="m">Correlation does not imply causation.</p></div>`)}});

/* ----- findings & about ----- */
wrap('findings',()=>{$('#page .hero').insertAdjacentHTML('afterend',`<div class="legend"><span class="tag real" style="margin:0">Real data</span> user-uploaded CSV statistics <span class="tag demo">Demo data</span> synthetic dataset <span class="tag sim">Simulated result</span> placeholder model metrics</div>${ai('AI-Generated Research Summary',aiSum())}`)});
wrap('about',()=>{$('#page').insertAdjacentHTML('beforeend',`<div class="card"><h3>Methodology timeline</h3><div class="tl">${[['Collect','Sustained-vowel recordings'],['Preprocess','Resample, frame, window'],['Extract','Jitter, shimmer, HNR, nonlinear'],['Model','Scaled pipeline, grouped CV'],['Evaluate','Recall, AUC, calibration'],['Validate','External dataset']].map(s=>`<div><b>${s[0]}</b>${s[1]}</div>`).join('')}</div></div><div class="card"><h3>Domain</h3><div class="chips"><span>Biomedical Signal Processing</span><span>Machine Learning</span><span>AI for Healthcare Research</span></div><h3>Technologies</h3><div class="chips">${['HTML / CSS / JavaScript','Chart.js','Web Audio API','Python','FastAPI','scikit-learn','librosa','pandas','NumPy'].map(t=>`<span>${t}</span>`).join('')}</div></div>`)});

/* ----- command palette (Ctrl/⌘+K) ----- */
let cpS=0,cpF=[];
function cmdList(){return[...PAGES.map(p=>['Go to '+p[1],'Page',()=>go(p[0]),'']),['Analyze Voice','Command',()=>go('voice-analysis'),'record upload microphone waveform spectrogram'],['Open Dataset','Command',()=>go('dataset-insights'),'csv upload target'],['Compare Models','Command',()=>go('ml-comparison'),'leaderboard benchmark'],['View Findings','Command',()=>go('research-findings'),'conclusion limitations'],['Toggle Theme','Command',theme,'dark light'],['Toggle Sidebar','Command',collapse,'collapse'],['ROC curve','Evaluation',()=>go('model-evaluation'),'auc precision recall confusion matrix'],['Feature importance','Evaluation',()=>go('model-evaluation'),'ranking'],...DS.feats.slice(0,40).map(f=>['Feature: '+f,'Feature',()=>{GC.h=f;GC.x=f;go('feature-analysis')},info(f)])]}
function cpR(){const q=$('#cpi').value.toLowerCase();cpF=cmdList().filter(c=>(c[0]+' '+c[3]).toLowerCase().includes(q)).slice(0,9);cpS=Math.min(cpS,Math.max(0,cpF.length-1));$('#cpl').innerHTML=cpF.length?cpF.map((c,i)=>`<li role="option" aria-selected="${i===cpS}" data-i="${i}" class="${i===cpS?'on':''}"><span>${esc(c[0])}</span><small>${c[1]}</small></li>`).join(''):'<li class="m">No matches</li>'}
function cpOpen(o){$('#cp').hidden=!o;if(o){$('#cpi').value='';cpS=0;cpR();$('#cpi').focus()}}
function cpRun(i){const c=cpF[i];cpOpen(false);c&&c[2]()}

/* ----- init ----- */
$('#nav').innerHTML=GR.map(([g,ids])=>`<div class="ng">${g}</div>`+ids.map(id=>{const p=PAGES.find(x=>x[0]===id);return`<a href="#${id}" data-p="${id}" title="${p[1]}">${ic(p[3])}<span>${p[1]}</span></a>`}).join('')).join('');
$('#thm').innerHTML=ic(IC.moon,16);$('#cpb').innerHTML=ic(IC.se,16)+'<kbd>Ctrl K</kbd>';$('#clp').innerHTML=ic(IC.col,16);
document.body.insertAdjacentHTML('beforeend','<div id="cp" hidden><div class="cpb" role="dialog" aria-modal="true" aria-label="Command palette"><input id="cpi" placeholder="Search pages, features, models…" aria-label="Search commands" autocomplete="off"><ul id="cpl" role="listbox"></ul></div></div>');
$('#thm').onclick=theme;$('#clp').onclick=collapse;$('#cpb').onclick=()=>cpOpen(true);$('#cpi').oninput=()=>{cpS=0;cpR()};
$('#cp').onclick=e=>{if(e.target.id==='cp')cpOpen(false)};$('#cpl').onclick=e=>{const li=e.target.closest('li[data-i]');li&&cpRun(+li.dataset.i)};
$('#cpi').onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();cpS=Math.min(cpF.length-1,cpS+1);cpR()}else if(e.key==='ArrowUp'){e.preventDefault();cpS=Math.max(0,cpS-1);cpR()}else if(e.key==='Enter'){e.preventDefault();cpRun(cpS)}};
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();cpOpen($('#cp').hidden)}else if(e.key==='Escape'){if(!$('#cp').hidden)cpOpen(false);else $$('.card.fs').forEach(c=>c.querySelector('.ib').click())}});
route();
</script></body></html>
